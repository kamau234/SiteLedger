# Supabase CLI configuration for reproducing the SiteLedger schema locally.
# Usage:
#   supabase start            # local stack (Postgres, Auth, Storage, PostgREST)
#   supabase db reset         # apply supabase/migrations + seed.sql from scratch
#   supabase db push          # apply migrations to a linked remote project
#
# Never commit real project secrets here; link a remote project with `supabase link`.

project_id = "siteledger"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Local development only; configure the production site URL in the dashboard.
site_url = "http://localhost:3000"
